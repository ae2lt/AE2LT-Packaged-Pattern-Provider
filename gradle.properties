# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
# ForgeGradle 6 is not configuration-cache compatible, and its reobf tasks do not
# round-trip through the build cache. Both stay off on the 1.20.1 branch.
## Environment Properties
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.20.2)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.1.47
# The Forge version range can use any version of Forge as bounds
forge_version_range=[47.1.3,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[47,)
# The mapping channel/version to query. 1.20.1 has no Parchment build in this
# stack, so the official Mojang names are used, matching AE2LT's 1.20.1 branch.
mapping_channel=official
mapping_version=1.20.1
ae2_version=15.4.10
ae2_version_range=[15.4.10,16)
guideme_version=20.1.15
ae2wtlib_version=15.3.3-forge
curios_version=5.14.1+1.20.1
jei_version=15.21.0.144
jade_file_id=8479276
# Mandatory dependencies of AE2WTLib on 1.20.1.
architectury_version=9.2.14
cloth_config_version=11.1.136
# AE2 Lightning Tech and Thunderbolt Core come from libs/. See the local-jar
# entries at the bottom of this file for the actual file paths and version
# ranges. The build no longer consumes them from Maven Local.
ae2lt_version_range=[2.1.0-beta.4,3.0.0)
#thunderbolt_version=2.0.0-beta.1
#thunderbolt_version_range=[2.0.0-beta.1,2.1.0)
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=ae2ltpp
# The human-readable display name for the mod.
mod_name=AE2LT Packaged Pattern Provider
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GNU LGPL 3.0
# The mod version. See https://semver.org/
mod_version=1.2.0-beta.4
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.moakiee.ae2lt.packaged
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=MOAKIEE,gjmhmm8
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Packaged Pattern Provider addon for AE2 Lightning Tech.

# Local AE2LT 1.20.1 jar bundled in the project libs folder
ae2lt_jar=libs/ae2lt-forge-1.20.1-2.1.0-beta.4.jar
# Local Thunderbolt 1.20.1 jar bundled in the project libs folder
thunderbolt_jar=libs/thunderbolt-forge-1.20.1-2.0-alpha-1.20.1.jar
thunderbolt_version_range=[2.0-alpha-1.20.1,3.0.0)
